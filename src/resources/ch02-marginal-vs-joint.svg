<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="量子ビットを1つずつ見ると、どちらの回路も0と1がほぼ半々。結果を組で見ると、独立に H をかけた回路は4通り、H と CNOT の回路は2通り">
<rect x="0.5" y="0.5" width="859" height="359" rx="10" fill="#f6f7f9" stroke="#c9ced6"/>
<g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
