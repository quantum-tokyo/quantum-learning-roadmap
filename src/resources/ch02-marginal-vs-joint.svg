<text x="508" y="219.0" font-size="15" text-anchor="end" fill="#333a45">1</text>
<rect x="520" y="118" width="96" height="64" fill="#bfc2c8" stroke="#9aa1ad" stroke-width="1"/>
<text x="568.0" y="157" font-size="19" font-weight="700" text-anchor="middle" fill="#333a45">52.6%</text>
<rect x="616" y="118" width="96" height="64" fill="#ffffff" stroke="#9aa1ad" stroke-width="1"/>
