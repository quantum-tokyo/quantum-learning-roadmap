<text x="724" y="155.0" font-size="16" fill="#333a45">約50%</text>
<text x="664.0" y="270" font-size="16" text-anchor="middle" fill="#333a45">約50%</text>
<text x="724" y="219.0" font-size="16" fill="#333a45">約50%</text>
<text x="616" y="292" font-size="12" text-anchor="middle" fill="#6b7380">1つ目だけを見る</text>
<text x="724" y="270" font-size="12" fill="#6b7380">2つ目だけ</text>
