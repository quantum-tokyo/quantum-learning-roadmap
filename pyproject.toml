[project]
name = "quantum-learning-roadmap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "jupyter-book==2.1.5",
    "matplotlib>=3.11.0",
    "pylatexenc==2.10",
    "python-dotenv==1.0.1",
    "qiskit-addon-cutting>=0.10.0",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.40.1",
    # Capped below 2.5: qiskit 2.5.0 added qiskit.visualization.__all__ with a
    # "draw" entry that does not resolve, so `from qiskit.visualization import *`
    # raises. Lift the cap once that is fixed upstream.
    "qiskit[visualization]>=2.4,<2.5",
]

[dependency-groups]
# scripts/run-notebooks.py drives the notebooks; nbclient is otherwise only
# present as a transitive dependency of jupyter-book.
dev = [
    "nbclient>=0.10",
    # run-notebooks.py reads src/myst.yml's toc to check the manifest against it.
    "pyyaml>=6",
]
# Only 2024-spring-lab3-ai-transpiler-ja.ipynb needs this, and only with an IBM
# Quantum account. It drags in torch and the CUDA toolkit via qiskit-gym, so it
# stays out of the default sync: `uv sync --group ai-transpiler`.
ai-transpiler = [
    "qiskit-ibm-transpiler>=0.14",
]
