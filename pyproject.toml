[project]
name = "quantum-learning-roadmap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "jupyter-book==2.1.5",
    "matplotlib>=3.11.0",
    "pylatexenc==2.10",
    "python-dotenv==1.0.1",
    "qiskit-addon-cutting==0.10.0",
    "qiskit-aer==0.18.0",
    "qiskit-ibm-runtime==0.50.0",
    "qiskit-ibm-transpiler==0.14.2",
    "qiskit[visualization]==2.4.2",
]

[dependency-groups]
# scripts/run-notebooks.py drives the notebooks; nbclient is otherwise only
# present as a transitive dependency of jupyter-book.
dev = [
    "nbclient>=0.10",
    # run-notebooks.py reads src/myst.yml's toc to check the manifest against it.
    "pyyaml>=6",
]
